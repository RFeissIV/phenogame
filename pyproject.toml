[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenogame"
version = "0.3.0"
description = "Farmer vs Nature: game-theoretic crop phenology decisions with EML-reducible response functions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Richard A. Feiss IV"}
]
keywords = [
    "phenology", "crop-modeling", "symbolic-regression", "EML",
    "BBCH", "DSSAT", "APSIM", "thermal-time", "response-functions"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "build", "twine", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/RFeissIV/phenogame"
Archive = "https://doi.org/10.5281/zenodo.20017093"

[tool.setuptools.packages.find]
include = ["phenogame*"]

[tool.setuptools.package-data]
phenogame = ["data/*.csv", "data/usa_npn_datasheets/*.zip", "data/usa_npn_datasheets/README.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# We intentionally select a narrow rule set so legacy modules
# (math-heavy code with single-letter names) don't fail CI on this patch.
# The data-induced EML game extension modules (validation.py, grape demo, etc.)
# are clean under the full default rule set.
select = ["F"]
ignore = [
    "F401",  # legacy modules import-but-conditional-use a few symbols
    "F841",  # legacy modules contain a few unused locals in math derivations
    "F541",  # legacy modules use f-strings without placeholders for consistency
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["phenogame"]
omit = ["phenogame/viz.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
